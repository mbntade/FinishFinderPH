plugins {
    id "com.android.application"
}

android {
    namespace "io.github.mbntade.finishfinder"
    compileSdk 35

    defaultConfig {
        applicationId "io.github.mbntade.finishfinder"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    // The app screens come straight from the web version in /web, so both stay the same.
    sourceSets {
        main {
            assets.srcDirs = ["../../web"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.activity:activity:1.9.3"
    implementation "androidx.webkit:webkit:1.12.1"
}
