name: Build Android app

on:
  push:
    branches: [main]
    paths: ["web/**", "android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build test APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FinishFinderPH-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FinishFinderPH-apk-${{ github.run_number }}
          path: FinishFinderPH-${{ github.run_number }}.apk
          retention-days: 30
